version: "3.8"

services:
  asterisk:
    image: call-center-asterisk-runtime:arm64
    container_name: asterisk
    hostname: asterisk
    cpus: '1.5'
    cpu_shares: 1024
    mem_limit: 512m
    mem_reservation: 256m
    memswap_limit: 512m
    shm_size: '128m'
    pids_limit: 200
    volumes:
      - ./docker/asterisk/config:/etc/asterisk
      - asterisk_recordings:/var/spool/asterisk/monitor
      - asterisk_voicemail:/var/spool/asterisk/voicemail
      - asterisk_sounds:/var/lib/asterisk/sounds
      - asterisk_cdr:/var/log/asterisk/cdr-csv
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10100:10000-10100/udp"
      - "5038:5038"
      - "8088:8088"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - ASTERISK_PUBLIC_IP=${ASTERISK_PUBLIC_IP}
      - TWILIO_SIP_DOMAIN=${TWILIO_SIP_DOMAIN}
      - TWILIO_IPS=${TWILIO_IPS}
      - TWILIO_USERNAME=${TWILIO_USERNAME}
      - TWILIO_PASSWORD=${TWILIO_PASSWORD}
      - TWILIO_ORIGINATING_NUMBER=${TWILIO_ORIGINATING_NUMBER}
      - EXT_100_USERNAME=${EXT_100_USERNAME}
      - EXT_100_PASSWORD=${EXT_100_PASSWORD}
      - EXT_100_CALLERID=${EXT_100_CALLERID}
      - APP_DOMAIN=${APP_DOMAIN}
    networks:
      - call-center-network
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    container_name: mysql
    cpus: '1.0'
    cpu_shares: 768
    mem_limit: 768m
    mem_reservation: 384m
    memswap_limit: 768m
    shm_size: '256m'
    pids_limit: 150
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=384M
      --innodb-buffer-pool-instances=2
      --innodb-log-buffer-size=16M
      --innodb-flush-method=O_DIRECT
      --innodb-flush-log-at-trx-commit=2
      --innodb-file-per-table=1
      --max-connections=100
      --thread-cache-size=16
      --table-open-cache=2000
      --tmp-table-size=32M
      --max-heap-table-size=32M
      --slow-query-log=0
      --performance-schema=OFF
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      call-center-network:
        aliases:
          - db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      timeout: 10s
      retries: 5
      interval: 20s
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    image: adminer:latest
    container_name: adminer
    cpus: '0.25'
    cpu_shares: 256
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 50
    restart: unless-stopped
    networks:
      - call-center-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: backend
    cpus: '0.75'
    cpu_shares: 512
    mem_limit: 384m
    mem_reservation: 192m
    memswap_limit: 384m
    pids_limit: 100
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8001
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - JWT_SECRET=your-secret-key-change-in-production
      - JWT_EXPIRATION=24h
      - CORS_ALLOWED_ORIGINS=https://app.soham.top,https://138.2.68.107
      - ASTERISK_ARI_URL=http://asterisk:8088/ari
      - ASTERISK_ARI_USERNAME=asterisk
      - ASTERISK_ARI_PASSWORD=asterisk
      - ASTERISK_ARI_APP=callcenter
      - SOFTPHONE_DOMAIN=app.soham.top
      - SOFTPHONE_PROXY_HOST=app.soham.top
      - SOFTPHONE_PROXY_PORT=443
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - call-center-network
    volumes:
      - ./backend/.env:/app/.env:ro
      - /var/run/fail2ban:/var/run/fail2ban
      - /var/log/fail2ban.log:/var/log/fail2ban.log:ro
      - asterisk_recordings:/var/spool/asterisk/monitor:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: frontend
    cpus: '0.5'
    cpu_shares: 512
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 50
    restart: unless-stopped
    networks:
      - call-center-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  caddy:
    image: caddy:latest
    container_name: caddy
    cpus: '0.5'
    cpu_shares: 512
    mem_limit: 256m
    mem_reservation: 128m
    pids_limit: 50
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP for ACME challenges and redirects
      - "443:443"      # HTTPS for frontend
      - "8443:8443"    # HTTPS for backend API
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - call-center-network
      # - postal_default  # Comment out if postal network not available
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  
networks:
  call-center-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
  # postal_default:
  #   external: true  # Comment out if postal network not available
        
volumes:
  mysql_data:
    driver: local
  asterisk_recordings:
    driver: local
  asterisk_voicemail:
    driver: local
  asterisk_sounds:
    driver: local
  asterisk_cdr:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local