[general]
static=yes
writeprotect=no
clearglobalvars=no

[default]
exten => s,1,NoOp(Default context)
 same => n,Hangup()

[set-tenant-accountcode]
exten => s,1,NoOp(Assign tenant accountcode and start recording)
 same => n,Set(CHANNEL(accountcode)=demo-tenant)
 same => n,Set(CDR(userfield)=${UNIQUEID}.wav)
 same => n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}.wav)
 same => n,Return()

[from-twilio]
; Route the Twilio DID to extension 100 (Zoiper)
exten => +19863334949,1,NoOp(Inbound Twilio call for ${EXTEN})
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Answer()
 same => n,Goto(internal,1000,1)

; Fallback: match 10-digit version of the DID
exten => 9863334949,1,NoOp(Inbound Twilio 10-digit match ${EXTEN})
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Answer()
 same => n,Goto(internal,1000,1)

; Catch-all to avoid call loops
exten => _X.,1,NoOp(Unhandled Twilio DID ${EXTEN})
 same => n,Playback(silence/1&invalid)
 same => n,Hangup()

[outbound]
; Dial out via Twilio SIP trunk
; Use prefix 9 to dial external numbers: dial 9 + phone number
; OR dial +1XXXXXXXXXX directly for E.164 format
; Examples: 
;   915551234567 calls +15551234567 (adds + prefix for E.164)
;   9+15551234567 calls +15551234567 (handles + in dial string)
;   +15551234567 calls +15551234567 (direct E.164 dialing)

; Pattern for 9-prefix dialing
exten => _9.,1,NoOp(Outbound via Twilio: ${EXTEN})
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Set(NUM=${EXTEN:1})
 same => n,GotoIf($["${NUM:0:1}" = "+"]?dial:add_plus)
 same => n(add_plus),Set(NUM=+${NUM})
 same => n(dial),Set(CALLERID(num)=+19863334949)
 same => n,Set(CALLERID(name)=CallCenter)
 same => n,NoOp(Dialing ${NUM} from ${CALLERID(num)})
 same => n,Dial(PJSIP/${NUM}@twilio_trunk,30)
 same => n,Hangup()

; Pattern for direct E.164 dialing (+1XXXXXXXXXX)
exten => _+1XXXXXXXXXX,1,NoOp(Direct E.164 Outbound: ${EXTEN})
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Set(CALLERID(num)=+19863334949)
 same => n,Set(CALLERID(name)=CallCenter)
 same => n,NoOp(Dialing ${EXTEN} from ${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN}@twilio_trunk,30)
 same => n,Hangup()

; Pattern for UK numbers (+44XXXXXXXXXX)
exten => _+44XXXXXXXXXX,1,NoOp(UK E.164 Outbound: ${EXTEN})
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Set(CALLERID(num)=+19863334949)
 same => n,Set(CALLERID(name)=CallCenter)
 same => n,NoOp(Dialing ${EXTEN} from ${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN}@twilio_trunk,30)
 same => n,Hangup()

; Pattern for any international E.164 number (+XXXXXXXXXXX)
exten => _+X.,1,NoOp(International E.164 Outbound: ${EXTEN})
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Set(CALLERID(num)=+19863334949)
 same => n,Set(CALLERID(name)=CallCenter)
 same => n,NoOp(Dialing ${EXTEN} from ${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN}@twilio_trunk,30)
 same => n,Hangup()

[internal]
; WebRTC Softphone Extensions
exten => 1000,1,NoOp(Ringing extension 1000)
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Ringing()
 same => n,Dial(PJSIP/1000,30)
 same => n,Hangup()

exten => 1001,1,NoOp(Ringing extension 1001)
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Ringing()
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

include => outbound

[from-internal]
; Context alias for wizard-configured endpoints
include => internal
include => outbound
; Ensure accountcode is set early for internal/local calls
exten => s,1,NoOp(Set accountcode for from-internal)
 same => n,Set(CHANNEL(accountcode)=demo-tenant)

; ==================== Test Extensions ====================
; Echo test - dial 600 to test audio and microphone
exten => 600,1,NoOp(Echo Test Started by ${CALLERID(num)})
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(silence/1&beep)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Music on hold test - dial 601
exten => 601,1,NoOp(Music On Hold Test)
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Answer()
 same => n,MusicOnHold()
 same => n,Hangup()

; Milliwatt tone - dial 602
exten => 602,1,NoOp(Milliwatt Tone Test)
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Answer()
 same => n,Milliwatt()
 same => n,Hangup()

; WebRTC Softphone Extensions
exten => 1000,1,NoOp(Calling extension 1000)
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Dial(PJSIP/1000,30)
 same => n,Hangup()

exten => 1001,1,NoOp(Calling extension 1001)
 same => n,Gosub(set-tenant-accountcode,s,1)
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()
