; PJSIP configuration for standalone Asterisk + Twilio SIP trunk + Zoiper softphones

[global]
type=global
user_agent=Asterisk-Twilio-Docker

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=app.soham.top
external_media_address=138.2.68.107
local_net=172.0.0.0/8
allow_reload=yes

; ==================== Twilio SIP trunk ====================
; Twilio sends from the IP(s) listed below (IP ACL) and we place outbound calls
; to the SIP domain configured on the trunk. Credentials are optional but enabled here.

[twilio_trunk]
type=aor
contact=sip:nlpbay.pstn.ashburn.twilio.com:5060
; Twilio does not respond to OPTIONS pings - disable qualification to keep contact Available
qualify_frequency=0

[twilio_trunk]
type=endpoint
transport=transport-udp
context=from-twilio
disallow=all
allow=ulaw,alaw
aors=twilio_trunk
outbound_auth=twilio_auth
; Route outbound calls via Twilio's Ashburn edge IP to bypass internal DNS resolver issue
; The \;lr sets loose routing so the Request-URI keeps the correct domain name
outbound_proxy=sip:54.172.60.0:5060\;lr
from_domain=nlpbay.pstn.ashburn.twilio.com
from_user=+19863334949
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
direct_media=no
media_address=138.2.68.107
dtmf_mode=rfc4733
t38_udptl=no

[twilio_trunk]
type=identify
endpoint=twilio_trunk
; Twilio Ashburn/Virginia edge uses 54.172.60.0/23 (covers .60.x and .61.x)
match=54.172.60.0/24
match=54.172.61.0/24
; Twilio Oregon edge
match=54.244.51.0/24
; Additional Twilio global edge IPs
match=54.171.127.192/26
match=35.156.191.128/25
match=177.71.206.192/26

[twilio_auth]
type=auth
auth_type=userpass
username=Admin
password=Admin@1234567

; ==================== Softphone extensions ====================
; Extensions now loaded from database via ARA
; To add/remove extensions, use database:
; - INSERT INTO ps_endpoints (id, transport, aors, auth, context, disallow, allow, ...)
; - INSERT INTO ps_auths (id, username, password, auth_type)
; - INSERT INTO ps_aors (id, max_contacts)
; - INSERT INTO ps_endpoint_id_ips (id, endpoint, match) for identification
;
; No restart needed! Extensions load on-demand from database.



; WebSocket transport for WebRTC clients
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
external_signaling_address=app.soham.top
external_media_address=138.2.68.107

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088
external_signaling_address=app.soham.top
external_media_address=138.2.68.107

; (duplicate transport definitions removed - see transport-ws and transport-wss above)
