; IAX (Inter-Asterisk eXchange) Protocol Configuration
; Enable IAX2 for softphones and trunk connections

[general]
; Network configuration
bind=0.0.0.0
port=4569
protocol=iax2
language=en
context=from-iax

; Security settings
autokill=yes
maxauthreq=100
maxregexpire=3600
minregexpire=60

; Calling features
allowfwdnumber=no
autokill=yes
calltoken=require_auto

; Enable these extensions for IAX
; they inherit settings from Asterisk database (ps_endpoints/ps_auths)
; and the extension's context determines dialplan routing

[1000]
type=friend
auth=md5
secret=agent100pass
context=from-iax
transfer=no
disallow=all
allow=ulaw
allow=alaw
allow=g726
qualify=yes

